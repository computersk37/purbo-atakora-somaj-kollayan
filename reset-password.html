<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      padding: 20px;
    }
    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #176b3a;
      color: white;
      border: 0;
      border-radius: 7px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>নতুন পাসওয়ার্ড তৈরি করুন</h2>
    <input id="password" type="password"
      placeholder="নতুন পাসওয়ার্ড" required>
    <input id="confirmPassword" type="password"
      placeholder="পাসওয়ার্ড আবার লিখুন" required>
    <button id="savePassword">পাসওয়ার্ড সংরক্ষণ</button>
    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
    );

    document.getElementById("savePassword").onclick = async () => {
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password.length < 8) {
        message.textContent = "পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "দুটি পাসওয়ার্ড মিলছে না।";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "সমস্যা: " + error.message;
        return;
      }

      message.textContent =
        "নতুন পাসওয়ার্ড সফলভাবে সংরক্ষিত হয়েছে।";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    };
  </script>
</body>
</html>
