
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      padding: 20px;
    }
    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #176b3a;
      color: white;
      border: 0;
      border-radius: 7px;
    }
  </style>
</head>
<body>
<div class="box">
  <h2>নতুন পাসওয়ার্ড তৈরি করুন</h2>
  <input id="password" type="password" placeholder="নতুন পাসওয়ার্ড">
  <input id="confirmPassword" type="password" placeholder="পাসওয়ার্ড আবার লিখুন">
  <button id="savePassword" type="button">পাসওয়ার্ড সংরক্ষণ</button>
  <p id="message">পেজ প্রস্তুত হচ্ছে...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const message = document.getElementById("message");

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

message.textContent = "পেজ প্রস্তুত। নতুন পাসওয়ার্ড দিন।";

document.getElementById("savePassword").onclick = async function () {
  try {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
      message.textContent = "কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।";
      return;
    }

    if (password !== confirmPassword) {
      message.textContent = "দুটি পাসওয়ার্ড মিলছে না।";
      return;
    }

    message.textContent = "পাসওয়ার্ড সংরক্ষণ হচ্ছে...";

    const { data, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;
    if (!data.session) {
      throw new Error("রিসেট সেশন পাওয়া যায়নি। Gmail থেকে নতুন লিংক খুলুন।");
    }

    const { error } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) throw error;

    message.textContent = "নতুন পাসওয়ার্ড সফলভাবে সংরক্ষিত হয়েছে!";

    setTimeout(function () {
      window.location.href = "login.html";
    }, 2000);

  } catch (error) {
    message.textContent = "সমস্যা: " + error.message;
  }
};
</script>
</body>
</html>
