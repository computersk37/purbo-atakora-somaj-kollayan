<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>সদস্য নিবন্ধন - পূর্ব আতাকরা সমাজ কল্যাণ</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f7f3;
      padding: 20px;
      color: #18352a;
    }

    .form-box {
      max-width: 480px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 {
      text-align: center;
      color: #075c3b;
    }

    label {
      display: block;
      margin-top: 13px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #075c3b;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

    .print-area {
      display: none;
      max-width: 650px;
      margin: 25px auto;
      background: white;
      border-radius: 14px;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
      }

      .no-print {
        display: none !important;
      }

      #printArea {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

<div class="form-box">
  <h2>সদস্য নিবন্ধন আবেদন</h2>

  <form id="registerForm">

    <label>পূর্ণ নাম</label>
    <input id="name" required>

    <label>ইমেইল</label>
    <input id="email" type="email" required>

    <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
    <input id="password" type="password" minlength="6" required>

    <label>ঠিকানা</label>
    <textarea id="address" required></textarea>

    <label>মোবাইল নম্বর</label>
    <input id="phone" type="tel" required>

    <label>পেশা</label>
    <select id="occupation" required>
      <option value="">পেশা নির্বাচন করুন</option>
      <option value="চাকরিজীবী">চাকরিজীবী</option>
      <option value="ব্যবসায়ী">ব্যবসায়ী</option>
      <option value="কৃষক">কৃষক</option>
      <option value="ছাত্র/ছাত্রী">ছাত্র/ছাত্রী</option>
      <option value="শ্রমিক">শ্রমিক</option>
      <option value="অন্যান্য">অন্যান্য</option>
    </select>

    <label>রক্তের গ্রুপ</label>
    <select id="blood_group" required>
      <option value="">রক্তের গ্রুপ নির্বাচন করুন</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>

    <label>আপনি কি প্রবাসী?</label>
    <select id="is_expat" required>
      <option value="">নির্বাচন করুন</option>
      <option value="হ্যাঁ">হ্যাঁ</option>
      <option value="না">না</option>
    </select>

    <label>প্রবাসী হলে কোন দেশে থাকেন?</label>
    <input id="country" type="text"
      placeholder="দেশের নাম লিখুন (ঐচ্ছিক)">

    <label>বিস্তারিত (ঐচ্ছিক)</label>
    <textarea id="details"></textarea>

    <label>প্রোফাইল ছবি (ঐচ্ছিক)</label>
    <input type="file" id="photo" accept="image/*">

    <button type="submit">আবেদন জমা দিন</button>
  </form>

  <p id="message"></p>
</div>

<!-- রঙিন আবেদনপত্র -->
<div id="printArea" class="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const printArea = document.getElementById("printArea");

// নিরাপদে লেখা দেখানোর জন্য
function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];
  });
}

// সুন্দর রঙিন আবেদনপত্র তৈরি
function showPrintableApplication(draft, email) {

  const applicationDate =
    new Date().toLocaleDateString("bn-BD");

  const fields = [
    ["আবেদনের তারিখ", applicationDate],
    ["পূর্ণ নাম", draft.full_name],
    ["ইমেইল", email],
    ["ঠিকানা", draft.address],
    ["মোবাইল নম্বর", draft.phone],
    ["পেশা", draft.occupation],
    ["রক্তের গ্রুপ", draft.blood_group],
    ["প্রবাসী", draft.is_expat],
    ["দেশ", draft.country || "প্রযোজ্য নয়"],
    ["বিস্তারিত", draft.details || "উল্লেখ নেই"]
  ];

  printArea.innerHTML = `

    <div style="
      border:3px solid #075c3b;
      border-radius:14px;
      overflow:hidden;
      background:#ffffff;
      font-family:Arial,sans-serif;
    ">

      <div style="
        background:#075c3b;
        color:white;
        text-align:center;
        padding:25px 12px;
      ">
        <div style="margin-bottom:10px;">
  <img
    src="file_00000000efe88211984c7a7fee7e28c5.png"
    alt="পূর্ব আতাকরা সমাজ কল্যাণ লোগো"
    style="
      width:90px;
      height:90px;
      object-fit:contain;
      background:white;
      border-radius:50%;
      padding:5px;
      border:2px solid #f5d46b;
    "
  >
</div>
        <h2 style="
          color:#f5d46b;
          margin:8px 0;
          font-size:24px;
        ">
          পূর্ব আতাকরা সমাজ কল্যাণ
        </h2>

        <p style="
          margin:5px 0;
          color:#e7f5ec;
        ">
          ঐক্য • সহযোগিতা • কল্যাণ
        </p>
      </div>

      <div style="padding:22px;">

        <h3 style="
          text-align:center;
          color:#075c3b;
          border-bottom:2px solid #d6b64c;
          padding-bottom:12px;
        ">
          সদস্য নিবন্ধন আবেদনপত্র
        </h3>

        <div style="
          text-align:center;
          background:#e3f5e9;
          color:#08783f;
          padding:12px;
          border-radius:8px;
          font-weight:bold;
          margin:18px 0;
          border:1px solid #8bc9a1;
        ">
          ✓ আবেদন অনুমোদিত (APPROVED)
        </div>

        <div style="
          background:#f6faf7;
          border:1px solid #d5e6da;
          border-radius:9px;
          padding:12px;
        ">

          ${fields.map((item, index) => `
            <div style="
              display:flex;
              flex-wrap:wrap;
              gap:8px;
              padding:12px 8px;
              border-bottom:1px solid #dce8df;
              background:${index % 2 === 0 ? "#ffffff" : "#f0f7f2"};
              line-height:1.7;
            ">
              <strong style="
                color:#075c3b;
                min-width:125px;
              ">
                ${escapeHTML(item[0])}:
              </strong>

              <span style="color:#263d30;">
                ${escapeHTML(item[1])}
              </span>
            </div>
          `).join("")}

        </div>

        <div style="
          text-align:center;
          margin-top:30px;
          color:#075c3b;
        ">
          <p style="font-weight:bold;font-size:17px;">
            পূর্ব আতাকরা সমাজ কল্যাণ
          </p>

          <p style="font-size:12px;color:#777;">
            সমাজের ঐক্য ও কল্যাণে আমরা অঙ্গীকারবদ্ধ
          </p>
        </div>

        <div style="
          display:flex;
          justify-content:space-between;
          gap:20px;
          margin-top:40px;
          color:#444;
          text-align:center;
          font-size:13px;
        ">
          <div style="
            border-top:1px solid #888;
            padding-top:8px;
            width:45%;
          ">
            সদস্যের স্বাক্ষর
          </div>

          <div style="
            border-top:1px solid #888;
            padding-top:8px;
            width:45%;
          ">
            কর্তৃপক্ষ
          </div>
        </div>

        <button type="button"
          class="no-print"
          onclick="window.print()"
          style="
            width:100%;
            margin-top:25px;
            padding:14px;
            background:#075c3b;
            color:white;
            border:0;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
          ">
          🖨 আবেদনপত্র প্রিন্ট করুন
        </button>

      </div>
    </div>
  `;

  printArea.style.display = "block";
}

// আবেদন জমা
async function submitApplication(user, draft, photoFile = null) {

  let photoPath = null;

  if (photoFile) {

    if (!photoFile.type.startsWith("image/")) {
      throw new Error("শুধু ছবির ফাইল নির্বাচন করুন।");
    }

    if (photoFile.size > 2 * 1024 * 1024) {
      throw new Error("ছবির সাইজ ২ MB-এর কম হতে হবে।");
    }

    const fileName =
      `${user.id}/${Date.now()}-${photoFile.name}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("member-photos")
      .upload(fileName, photoFile, {
        contentType: photoFile.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    photoPath = fileName;
  }

  const { error } = await supabaseClient
    .from("member_applications")
    .insert({
      user_id: user.id,
      full_name: draft.full_name,
      address: draft.address,
      phone: draft.phone,
      occupation: draft.occupation,
      blood_group: draft.blood_group,
      is_expat: draft.is_expat,
      country: draft.country,
      details: draft.details,
      photo_url: photoPath,
      approval_status: "approved"
    });

  if (error) throw error;

  localStorage.removeItem("pending_member_application");
  localStorage.removeItem("pending_member_email");

  message.textContent =
    "অভিনন্দন! আপনার সদস্য আবেদন সফলভাবে জমা হয়েছে এবং অনুমোদিত হয়েছে।";

  showPrintableApplication(draft, user.email);

  form.reset();
}

// ফর্ম জমা
form.addEventListener("submit", async function(e) {

  e.preventDefault();

  message.textContent = "আবেদন প্রক্রিয়া চলছে...";

  const draft = {
    full_name: document.getElementById("name").value.trim(),
    address: document.getElementById("address").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    occupation: document.getElementById("occupation").value,
    blood_group: document.getElementById("blood_group").value,
    is_expat: document.getElementById("is_expat").value,
    country: document.getElementById("country").value.trim(),
    details: document.getElementById("details").value.trim()
  };

  const photoFile =
    document.getElementById("photo").files[0] || null;

  try {

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    const saved =
      localStorage.getItem("pending_member_application");

    // ইমেইল যাচাইয়ের পর আবেদন জমা
    if (sessionData.session && saved) {

      await submitApplication(
        sessionData.session.user,
        draft,
        photoFile
      );

      return;
    }

    // নতুন অ্যাকাউন্ট তৈরি
    const { data, error } = await supabaseClient.auth.signUp({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      options: {
        emailRedirectTo: window.location.href
      }
    });

    if (error) throw error;

    localStorage.setItem(
      "pending_member_application",
      JSON.stringify(draft)
    );

    localStorage.setItem(
      "pending_member_email",
      document.getElementById("email").value.trim()
    );

    if (data.session) {

      await submitApplication(data.user, draft, photoFile);

    } else {

      message.textContent =
        "অ্যাকাউন্ট তৈরি হয়েছে। ইমেইলে পাঠানো যাচাই লিংকে চাপ দিন। এরপর এই পেজে ফিরে এসে ছবি নির্বাচন করে আবার আবেদন জমা দিন।";
    }

  } catch (error) {

    message.textContent = "সমস্যা হয়েছে: " + error.message;

  }
});

// ইমেইল যাচাইয়ের পর আগের তথ্য ফিরিয়ে আনা
(async function checkVerifiedUser() {

  try {

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    const saved =
      localStorage.getItem("pending_member_application");

    if (data.session && saved) {

      const draft = JSON.parse(saved);

      document.getElementById("name").value =
        draft.full_name || "";

      document.getElementById("address").value =
        draft.address || "";

      document.getElementById("phone").value =
        draft.phone || "";

      document.getElementById("occupation").value =
        draft.occupation || "";

      document.getElementById("blood_group").value =
        draft.blood_group || "";

      document.getElementById("is_expat").value =
        draft.is_expat || "";

      document.getElementById("country").value =
        draft.country || "";

      document.getElementById("details").value =
        draft.details || "";

      document.getElementById("email").value =
        localStorage.getItem("pending_member_email") || "";

      document.getElementById("password").required = false;

      message.textContent =
        "ইমেইল যাচাই হয়েছে। এবার ছবি নির্বাচন করে আবেদন জমা দিন।";
    }

  } catch (error) {

    message.textContent = "সমস্যা হয়েছে: " + error.message;

  }

})();
</script>

</body>
</html>
