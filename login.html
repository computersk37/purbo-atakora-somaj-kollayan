<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন - পূর্ব আতাকরা সমাজ কল্যাণ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f7f3;
      padding: 20px;
      color: #18352a;
    }
    .login-box {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }
    h2 { text-align: center; color: #075c3b; }
    label { display: block; margin-top: 15px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #075c3b;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }
    #message { text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>সদস্য লগইন</h2>

    <form id="loginForm">
      <label>ইমেইল</label>
      <input id="email" type="email" required>

      <label>পাসওয়ার্ড</label>
      <input id="password" type="password" required>

      <button type="submit">লগইন করুন</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const message = document.getElementById("message");
      message.textContent = "লগইন হচ্ছে...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        message.textContent = "লগইন সমস্যা: " + error.message;
        return;
      }

      const { data: isAdmin, error: roleError } =
  await supabaseClient.rpc("is_admin");

if (roleError) {
  message.textContent = "পরিচয় যাচাই সমস্যা: " + roleError.message;
  return;
}

if (isAdmin) {
  window.location.href = "admin.html";
} else {
  window.location.href = "profile.html";
}
    });
  </script>
</body>
</html>
