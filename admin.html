<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>অ্যাডমিন ড্যাশবোর্ড - পূর্ব আতাকরা সমাজ কল্যাণ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f7f3;
      color: #18352a;
      padding: 16px;
    }
    .container {
      max-width: 850px;
      margin: auto;
    }
    h2 { color: #075c3b; text-align: center; }
    .application {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin: 15px 0;
      box-shadow: 0 2px 10px #0001;
    }
    .application p { overflow-wrap: anywhere; }
    button {
      border: 0;
      padding: 10px 15px;
      margin: 5px 5px 5px 0;
      border-radius: 6px;
      color: white;
      background: #08764b;
    }
    .reject { background: #b83232; }
    .logout { background: #555; }
    #message { text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
  <button
  type="button"
  onclick="window.location.href='index.html'"
  style="display:block; margin:15px auto; background:#075c3b;">
  🏠 হোমপেজে ফিরে যান
</button>
  <p id="message">যাচাই করা হচ্ছে...</p>
  <div id="applications"></div>
  <hr style="margin:25px 0;">

<h2>📢 নোটিশ পরিচালনা</h2>

<div class="application">
  <h3>নতুন নোটিশ প্রকাশ করুন</h3>

  <input
    type="text"
    id="noticeTitle"
    placeholder="নোটিশের শিরোনাম"
    style="width:100%; padding:12px; margin:10px 0;"
  >

  <textarea
    id="noticeContent"
    placeholder="নোটিশের বিস্তারিত লিখুন..."
    style="width:100%; min-height:120px; padding:12px; margin:10px 0;"
  ></textarea>

  <button id="publishNoticeBtn">
    নোটিশ প্রকাশ করুন
  </button>

  <div id="noticeMessage"></div>
</div>

<h3 style="margin-top:20px;">প্রকাশিত নোটিশ ও পুরোনো নোটিশ</h3>

<div id="noticesList">
  নোটিশ লোড হচ্ছে...
</div>
  <hr style="margin:25px 0;">

<h2>প্রোফাইল পরিবর্তনের আবেদন</h2>

<div id="editRequests">
  পরিবর্তনের আবেদন লোড হচ্ছে...
</div>
  <hr style="margin:25px 0;">

<h2>অনুমোদিত সদস্যদের তালিকা</h2>

<div id="approvedMembers">
  সদস্যদের তথ্য লোড হচ্ছে...
</div>
  <button class="logout" id="logoutBtn" hidden>লগআউট</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const message = document.getElementById("message");
const list = document.getElementById("applications");
const logoutBtn = document.getElementById("logoutBtn");
// নোটিশ প্রকাশ
document.getElementById("publishNoticeBtn").addEventListener("click", async () => {
  const title = document.getElementById("noticeTitle").value.trim();
  const content = document.getElementById("noticeContent").value.trim();
  const noticeMessage = document.getElementById("noticeMessage");

  if (!title || !content) {
    noticeMessage.textContent = "শিরোনাম ও বিস্তারিত লিখুন।";
    return;
  }

  const { error } = await supabaseClient
    .from("notices")
    .insert({
      title: title,
      content: content,
      is_published: true
    });

  if (error) {
    noticeMessage.textContent = "নোটিশ প্রকাশ হয়নি: " + error.message;
    return;
  }

  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeContent").value = "";
  noticeMessage.textContent = "নোটিশ সফলভাবে প্রকাশ হয়েছে।";

  await loadNotices();
});


// সব নোটিশ লোড
async function loadNotices() {
  const noticeList = document.getElementById("noticesList");
  noticeList.textContent = "নোটিশ লোড হচ্ছে...";

  const { data, error } = await supabaseClient
    .from("notices")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    noticeList.textContent = "নোটিশ লোড হয়নি: " + error.message;
    return;
  }

  noticeList.replaceChildren();

  if (!data || data.length === 0) {
    noticeList.textContent = "এখনো কোনো নোটিশ নেই।";
    return;
  }

  data.forEach(notice => {
    const card = document.createElement("div");
    card.className = "application";

    const title = document.createElement("h3");
    title.textContent = notice.title;

    const content = document.createElement("p");
    content.textContent = notice.content;

    const status = document.createElement("p");
    status.textContent = notice.is_published ? "প্রকাশিত" : "অপ্রকাশিত";

    const edit = document.createElement("button");
    edit.textContent = "সম্পাদনা";

    edit.onclick = async () => {
      const newTitle = prompt("নোটিশের নতুন শিরোনাম:", notice.title);
      if (newTitle === null) return;

      const newContent = prompt("নোটিশের নতুন বিস্তারিত:", notice.content);
      if (newContent === null) return;

      if (!newTitle.trim() || !newContent.trim()) {
        alert("শিরোনাম ও বিস্তারিত খালি রাখা যাবে না।");
        return;
      }

      const { error } = await supabaseClient
        .from("notices")
        .update({
          title: newTitle.trim(),
          content: newContent.trim(),
          updated_at: new Date().toISOString()
        })
        .eq("id", notice.id);

      if (error) {
        alert("পরিবর্তন হয়নি: " + error.message);
        return;
      }

      alert("নোটিশ পরিবর্তন হয়েছে।");
      await loadNotices();
    };

    const toggle = document.createElement("button");
    toggle.textContent = notice.is_published ? "অপ্রকাশিত করুন" : "প্রকাশ করুন";

    toggle.onclick = async () => {
      const { error } = await supabaseClient
        .from("notices")
        .update({ is_published: !notice.is_published })
        .eq("id", notice.id);

      if (error) {
        alert("সমস্যা: " + error.message);
        return;
      }

      await loadNotices();
    };

    const remove = document.createElement("button");
    remove.textContent = "মুছে ফেলুন";
    remove.className = "reject";

    remove.onclick = async () => {
      if (!confirm("আপনি কি এই নোটিশ মুছে ফেলতে চান?")) return;

      const { error } = await supabaseClient
        .from("notices")
        .delete()
        .eq("id", notice.id);

      if (error) {
        alert("মুছে ফেলা যায়নি: " + error.message);
        return;
      }

      await loadNotices();
    };

    card.append(title, content, status, edit, toggle, remove);
    noticeList.appendChild(card);
  });
    }
async function startDashboard() {
  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError || !sessionData.session) {
    message.textContent = "প্রথমে অ্যাডমিন হিসেবে লগইন করুন।";
    return;
  }

  const { data: admin, error: adminError } =
    await supabaseClient.rpc("is_admin");

  if (adminError || admin !== true) {
  message.textContent =
    "অ্যাডমিন যাচাই সমস্যা: " +
    (adminError ? adminError.message : "is_admin ফলাফল: " + String(admin));
  return;
}
  logoutBtn.hidden = false;
await loadApplications();
await loadEditRequests();
await loadApprovedMembers();
await loadNotices();
}

async function loadApprovedMembers() {
  const approvedList = document.getElementById("approvedMembers");
  approvedList.textContent = "সদস্যদের তথ্য লোড হচ্ছে...";

  const { data, error } = await supabaseClient
    .from("members")
    .select("id, full_name, address, phone, occupation, blood_group, is_expat, country, details, photo_url")
    .eq("approval_status", "approved")
    .order("created_at", { ascending: false });

  if (error) {
    approvedList.textContent = "তথ্য লোড হয়নি: " + error.message;
    return;
  }

  approvedList.replaceChildren();

  if (!data || data.length === 0) {
    approvedList.textContent = "কোনো অনুমোদিত সদস্য নেই।";
    return;
  }

  data.forEach(async member => {
    const card = document.createElement("div");
    card.className = "application";
if (member.photo_url) {
  const { data: photoData, error: photoError } =
    await supabaseClient.storage
      .from("member-photos")
      .createSignedUrl(member.photo_url, 3600);

  if (!photoError && photoData?.signedUrl) {
    const photo = document.createElement("img");
    photo.src = photoData.signedUrl;
    photo.alt = member.full_name || "সদস্যের ছবি";
    photo.style.width = "110px";
    photo.style.height = "110px";
    photo.style.objectFit = "cover";
    photo.style.borderRadius = "10px";
    photo.style.display = "block";
    photo.style.marginBottom = "12px";
    card.appendChild(photo);
  }
      }const photoInput = document.createElement("input");
photoInput.type = "file";
photoInput.accept = "image/*";
photoInput.style.display = "block";
photoInput.style.marginBottom = "12px";

card.appendChild(photoInput);
    const title = document.createElement("h3");
    title.textContent = member.full_name;

    const name = document.createElement("input");
    name.value = member.full_name || "";
    name.placeholder = "সদস্যের নাম";

    const address = document.createElement("input");
    address.value = member.address || "";
    address.placeholder = "ঠিকানা";

    const phone = document.createElement("input");
    phone.value = member.phone || "";
    phone.placeholder = "মোবাইল নম্বর";
const occupation = document.createElement("input");
occupation.value = member.occupation || "";
occupation.placeholder = "পেশা";

const bloodGroup = document.createElement("input");
bloodGroup.value = member.blood_group || "";
bloodGroup.placeholder = "রক্তের গ্রুপ";

const isExpat = document.createElement("input");
isExpat.value = member.is_expat || "";
isExpat.placeholder = "প্রবাসী কি না (হ্যাঁ/না)";

const country = document.createElement("input");
country.value = member.country || "";
country.placeholder = "দেশের নাম";
    const details = document.createElement("textarea");
    details.value = member.details || "";
    details.placeholder = "বিস্তারিত তথ্য";

    const save = document.createElement("button");
    save.textContent = "তথ্য সংরক্ষণ";

    save.onclick = async () => {
  const updateData = {
  full_name: name.value.trim(),
  address: address.value.trim(),
  phone: phone.value.trim(),
  occupation: occupation.value.trim(),
  blood_group: bloodGroup.value.trim(),
  is_expat: isExpat.value.trim(),
  country: country.value.trim(),
  details: details.value.trim()
};

  const selectedPhoto = photoInput.files[0];

  if (selectedPhoto) {
    if (!selectedPhoto.type.startsWith("image/")) {
      alert("শুধু ছবির ফাইল নির্বাচন করুন।");
      return;
    }

    if (selectedPhoto.size > 2 * 1024 * 1024) {
      alert("ছবির সাইজ ২ MB-এর কম হতে হবে।");
      return;
    }

    const { data: userData, error: userError } =
      await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
      alert("অ্যাডমিন লগইন যাচাই করা যায়নি।");
      return;
    }

    const safeName = selectedPhoto.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

    const newPhotoPath =
      `${userData.user.id}/${Date.now()}-${safeName}`;

    const { error: uploadError } = await supabaseClient.storage
      .from("member-photos")
      .upload(newPhotoPath, selectedPhoto, {
        contentType: selectedPhoto.type,
        upsert: false
      });

    if (uploadError) {
      alert("ছবি আপলোড হয়নি: " + uploadError.message);
      return;
    }

    updateData.photo_url = newPhotoPath;
  }

  const { error } = await supabaseClient
    .from("members")
    .update(updateData)
    .eq("id", member.id);

  if (error) {
    alert("তথ্য সংরক্ষণ হয়নি: " + error.message);
    return;
  }

  alert("সদস্যের তথ্য ও ছবি সফলভাবে সংরক্ষিত হয়েছে।");
  await loadApprovedMembers();
}; 
      

    card.append(
  title,
  name,
  address,
  phone,
  occupation,
  bloodGroup,
  isExpat,
  country,
  details,
  save
);
      approvedList.appendChild(card);
});
}

async function loadEditRequests() {
  const editList = document.getElementById("editRequests");
  editList.textContent = "পরিবর্তনের আবেদন লোড হচ্ছে...";

  const { data, error } = await supabaseClient
    .from("member_edit_requests")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    editList.textContent = "আবেদন লোড হয়নি: " + error.message;
    return;
  }

  editList.replaceChildren();

  if (!data || data.length === 0) {
    editList.textContent = "কোনো পরিবর্তনের আবেদন নেই।";
    return;
  }

  data.forEach(request => {
    const card = document.createElement("div");
    card.className = "application";

    const title = document.createElement("h3");
    title.textContent = request.full_name;

    const info = document.createElement("p");
    info.textContent =
  "ঠিকানা: " + request.address +
  " | মোবাইল: " + request.phone +
  " | পেশা: " + (request.occupation || "নেই") +
  " | রক্তের গ্রুপ: " + (request.blood_group || "নেই") +
  " | প্রবাসী: " + (request.is_expat || "নেই") +
  " | দেশ: " + (request.country || "নেই") +
  " | বিস্তারিত: " + (request.details || "নেই") +
  " | অবস্থা: " + request.status;

    card.append(title, info);

    if (request.status === "pending") {
      const approve = document.createElement("button");
      approve.textContent = "অনুমোদন";
      approve.onclick = () =>
        updateEditRequestStatus(request.id, "approved");

      const reject = document.createElement("button");
      reject.textContent = "বাতিল";
      reject.className = "reject";
      reject.onclick = () =>
        updateEditRequestStatus(request.id, "rejected");

      card.append(approve, reject);
    }

    editList.appendChild(card);
  });
}

async function updateEditRequestStatus(id, status) {
  if (!confirm("আপনি কি এই পরিবর্তনের আবেদনটি " + status + " করতে চান?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("member_edit_requests")
    .update({ status: status })
    .eq("id", id);

  if (error) {
    alert("সমস্যা: " + error.message);
    return;
  }

  alert("পরিবর্তনের আবেদন আপডেট হয়েছে।");
  await loadEditRequests();
  await loadApprovedMembers();
  }
  
async function loadApplications() {
  message.textContent = "আবেদন লোড হচ্ছে...";
  list.replaceChildren();

  const { data, error } = await supabaseClient
    .from("member_applications")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    message.textContent = "আবেদন লোড হয়নি: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    message.textContent = "এখনো কোনো আবেদন নেই।";
    return;
  }

  message.textContent = "মোট আবেদন: " + data.length;

  data.forEach(app => {
    const card = document.createElement("div");
    card.className = "application";

    const title = document.createElement("h3");
    title.textContent = app.full_name;

    const fields = [
  "ঠিকানা: " + app.address,
  "মোবাইল: " + app.phone,
  "পেশা: " + (app.occupation || "নেই"),
  "রক্তের গ্রুপ: " + (app.blood_group || "নেই"),
  "প্রবাসী: " + (app.is_expat || "নেই"),
  "দেশ: " + (app.country || "নেই"),
  "বিস্তারিত: " + (app.details || "নেই"),
  "অবস্থা: " + app.approval_status
];

    card.appendChild(title);

    fields.forEach(value => {
      const p = document.createElement("p");
      p.textContent = value;
      card.appendChild(p);
    });

    if (app.approval_status === "pending") {
      const approve = document.createElement("button");
      approve.textContent = "অনুমোদন";
      approve.onclick = () => updateStatus(app.id, "approved");

      const reject = document.createElement("button");
      reject.textContent = "বাতিল";
      reject.className = "reject";
      reject.onclick = () => updateStatus(app.id, "rejected");

      card.appendChild(approve);
      card.appendChild(reject);
    }

    list.appendChild(card);
  });
}

async function updateStatus(id, status) {
  if (!confirm("আপনি কি আবেদনটি " + status + " করতে চান?")) return;

  const { error } = await supabaseClient
    .from("member_applications")
    .update({ approval_status: status })
    .eq("id", id);

  if (error) {
    alert("সমস্যা: " + error.message);
    return;
  }

  alert("আবেদনের অবস্থা পরিবর্তন হয়েছে।");
  await loadApplications();
}

logoutBtn.addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

startDashboard().catch((error) => {
  const message = document.getElementById("message");
  if (message) {
    message.textContent = "ত্রুটি: " + error.message;
  }
});
</script>
</body>
  </html>
